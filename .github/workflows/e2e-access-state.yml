name: Learning access-state E2E

on:
  push:
    branches:
      - agent/eaw-shared-auth-entitlements
    paths:
      - '.github/workflows/e2e-access-state.yml'

permissions:
  contents: read

jobs:
  access-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RUNNER_URL: https://mhjykzrljvtxauaatlom.supabase.co/functions/v1/e2e-access-state-runner
    steps:
      - name: Verify revoke and expiry enforcement
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error \
            --request POST "$RUNNER_URL" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --output /tmp/result.json \
            --write-out '%{http_code}')"
          cat /tmp/result.json
          if [ "$STATUS" != '200' ]; then
            echo "::error::Access-state runner returned HTTP $STATUS"
            exit 1
          fi
          node -e "const d=require('/tmp/result.json'); if(d.ok!==true) process.exit(1); console.log('ACCESS_STATE_E2E=PASS'); console.log('CHECKS='+d.checks.join(','));"
