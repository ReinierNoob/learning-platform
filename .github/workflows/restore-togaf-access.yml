name: Restore TOGAF learning access

on:
  push:
    branches:
      - hotfix/restore-togaf-access-20260902

permissions:
  contents: read

concurrency:
  group: restore-togaf-learning-access
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_ZY5Sxra8t5DhA4S9zRTLmRnq
      VERCEL_PROJECT_ID: prj_ULEAHWZ1J4r1GDmzxDU1sGJ3uXaA
      VERCEL_PROJECT_NAME: learning-platform
      EAW_SUPABASE_URL: https://jtdcinvkpprgnwvtwvms.supabase.co
      EAW_SUPABASE_PUBLISHABLE_KEY: sb_publishable_N3wnY2NWs4QrF45TsOLuhQ_qaHbfv4W
    steps:
      - uses: actions/checkout@v4

      - name: Validate target Supabase binding before write
        shell: bash
        run: |
          STATUS="$(curl --silent --show-error --output /tmp/supabase-probe.json --write-out '%{http_code}' \
            --header "apikey: $EAW_SUPABASE_PUBLISHABLE_KEY" \
            "$EAW_SUPABASE_URL/rest/v1/courses?select=id&limit=1")"
          test "$STATUS" = '200' || { echo "::error::Target EAW Supabase URL/key pair is invalid (HTTP $STATUS)"; exit 1; }
          echo 'Target EAW Supabase URL/key pair: PASS'

      - name: Validate Vercel project access
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN missing'; exit 1; }
          STATUS="$(curl --silent --show-error --output /tmp/project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID")"
          test "$STATUS" = '200' || { echo "::error::Token cannot access learning-platform (HTTP $STATUS)"; exit 1; }

      - name: Repair Vercel target environment binding
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const common = [
            ['EAW_SUPABASE_URL', process.env.EAW_SUPABASE_URL],
            ['EAW_SUPABASE_PUBLISHABLE_KEY', process.env.EAW_SUPABASE_PUBLISHABLE_KEY],
          ];
          const payload = common.flatMap(([key, value]) => [
            { key, value, type: 'plain', target: ['production'], comment: 'Shared EAW Supabase runtime binding' },
            { key, value, type: 'plain', target: ['preview'], comment: 'Shared EAW Supabase runtime binding' },
          ]);
          fs.writeFileSync('/tmp/eaw-runtime-env.json', JSON.stringify(payload), { mode: 0o600 });
          NODE
          STATUS="$(curl --silent --show-error --output /tmp/eaw-runtime-env-response.json --write-out '%{http_code}' \
            --request POST \
            --url "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_TEAM_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/eaw-runtime-env.json)"
          rm -f /tmp/eaw-runtime-env.json
          case "$STATUS" in 200|201) ;; *) cat /tmp/eaw-runtime-env-response.json; echo "::error::Vercel environment repair failed (HTTP $STATUS)"; exit 1 ;; esac

      - name: Verify repaired Vercel values without logging them
        shell: bash
        run: |
          STATUS="$(curl --silent --show-error --output /tmp/envs-decrypted.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?decrypt=true&teamId=$VERCEL_TEAM_ID")"
          test "$STATUS" = '200' || { echo "::error::Cannot verify Vercel environment (HTTP $STATUS)"; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const envs = JSON.parse(fs.readFileSync('/tmp/envs-decrypted.json','utf8')).envs ?? [];
          const expected = new Map([
            ['EAW_SUPABASE_URL', process.env.EAW_SUPABASE_URL],
            ['EAW_SUPABASE_PUBLISHABLE_KEY', process.env.EAW_SUPABASE_PUBLISHABLE_KEY],
          ]);
          for (const target of ['production', 'preview']) {
            for (const [key, value] of expected) {
              const matches = envs.filter((entry) => entry.key === key && Array.isArray(entry.target) && entry.target.includes(target) && !entry.gitBranch);
              if (!matches.length) throw new Error(`${target}:${key}:missing`);
              const values = new Set(matches.map((entry) => entry.value).filter(Boolean));
              if (values.size !== 1 || !values.has(value)) throw new Error(`${target}:${key}:inconsistent`);
            }
          }
          console.log('Vercel EAW Supabase binding: PASS');
          NODE
          rm -f /tmp/envs-decrypted.json

      - name: Prepare production deployment payload from current application source
        shell: bash
        run: |
          python3 <<'PY'
          import base64, json, os
          from pathlib import Path
          excluded = {'.git', '.next', 'node_modules', '.vercel'}
          files = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              if path.as_posix().startswith('.github/'):
                  continue
              files.append({
                  'file': path.as_posix(),
                  'data': base64.b64encode(path.read_bytes()).decode(),
                  'encoding': 'base64',
              })
          payload = {
              'name': os.environ['VERCEL_PROJECT_NAME'],
              'project': os.environ['VERCEL_PROJECT_ID'],
              'target': 'production',
              'files': files,
              'gitMetadata': {
                  'remoteUrl': 'https://github.com/ReinierNoob/learning-platform',
                  'commitRef': 'main',
                  'commitMessage': 'Restore shared EAW Supabase runtime binding',
                  'ci': True,
                  'ciType': 'github-actions',
                  'ciGitRepoVisibility': 'public',
              },
              'projectSettings': {'framework':'nextjs','nodeVersion':'24.x'},
          }
          Path('/tmp/deployment.json').write_text(json.dumps(payload))
          PY

      - name: Deploy repaired production artifact
        id: deploy
        shell: bash
        run: |
          STATUS="$(curl --silent --show-error --output /tmp/deploy.json --write-out '%{http_code}' \
            --request POST \
            --url "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/deployment.json)"
          case "$STATUS" in 200|201) ;; *) cat /tmp/deploy.json; echo "::error::Production deployment failed (HTTP $STATUS)"; exit 1 ;; esac
          URL="$(node -e "const d=require('/tmp/deploy.json');process.stdout.write(d.url||'')")"
          ID="$(node -e "const d=require('/tmp/deploy.json');process.stdout.write(d.id||d.uid||'')")"
          test -n "$URL" -a -n "$ID" || { echo '::error::Deployment URL/ID missing'; exit 1; }
          echo "url=https://$URL" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Confirm repaired production READY
        shell: bash
        run: |
          ID='${{ steps.deploy.outputs.deployment_id }}'
          for attempt in $(seq 1 40); do
            STATUS="$(curl --silent --show-error --output /tmp/status.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$ID?teamId=$VERCEL_TEAM_ID")"
            test "$STATUS" = '200' || exit 1
            STATE="$(node -e "const d=require('/tmp/status.json');process.stdout.write(d.readyState||'')")"
            if [ "$STATE" = 'READY' ]; then echo 'Repaired learning production READY.'; exit 0; fi
            if [ "$STATE" = 'ERROR' ] || [ "$STATE" = 'CANCELED' ] || [ "$STATE" = 'BLOCKED' ]; then exit 1; fi
            sleep 10
          done
          echo '::error::Production deployment did not become READY'; exit 1
