name: EAW learning preview E2E

on:
  workflow_dispatch:
  push:
    branches:
      - agent/eaw-shared-auth-entitlements
    paths:
      - '.github/workflows/e2e-preview.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_URL: https://mhjykzrljvtxauaatlom.supabase.co
      SUPABASE_KEY: sb_publishable_qa9v9qDYMzr3Fr3h0N29gg_1Ip6gfb5
      EAW_BASE: https://enterprise-architecture-works-git-2668d7-reiniernoobs-projects.vercel.app
      LEARNING_BASE: https://learning-platform-4emgerbny-reiniernoobs-projects.vercel.app
      TRAINING_ID: 87ca0f96-3cb3-4d12-84bd-94cb77a3e603
      BOOTSTRAP_URL: https://mhjykzrljvtxauaatlom.supabase.co/functions/v1/e2e-learning-bootstrap
    steps:
      - name: Run purchase-to-learning preview chain
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::VERCEL_TOKEN missing'
            exit 1
          fi

          cleanup() {
            curl --silent --show-error --fail \
              --request POST "$BOOTSTRAP_URL" \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"action":"cleanup"}' >/dev/null || true
          }
          trap cleanup EXIT

          BOOTSTRAP="$(curl --silent --show-error --fail \
            --request POST "$BOOTSTRAP_URL" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"action":"bootstrap"}')"
          TOKEN_HASH="$(BOOTSTRAP="$BOOTSTRAP" node -e "const d=JSON.parse(process.env.BOOTSTRAP); process.stdout.write(d.token_hash||'')")"
          ENTITLEMENT_ID="$(BOOTSTRAP="$BOOTSTRAP" node -e "const d=JSON.parse(process.env.BOOTSTRAP); process.stdout.write(d.entitlement_id||'')")"
          if [ -z "$TOKEN_HASH" ] || [ -z "$ENTITLEMENT_ID" ]; then
            echo '::error::Bootstrap did not return the expected test identifiers'
            exit 1
          fi
          echo '✓ Preview test session bootstrap authorized against existing active entitlement'

          VERIFY_PAYLOAD="$(TOKEN_HASH="$TOKEN_HASH" node -e "process.stdout.write(JSON.stringify({token_hash:process.env.TOKEN_HASH,type:'email'}))")"
          SESSION="$(curl --silent --show-error --fail \
            --request POST "$SUPABASE_URL/auth/v1/verify" \
            --header "apikey: $SUPABASE_KEY" \
            --header 'Content-Type: application/json' \
            --data "$VERIFY_PAYLOAD")"
          ACCESS_TOKEN="$(SESSION="$SESSION" node -e "const d=JSON.parse(process.env.SESSION); process.stdout.write(d.access_token||'')")"
          if [ -z "$ACCESS_TOKEN" ]; then
            echo '::error::Could not create the temporary EAW user session'
            exit 1
          fi
          echo '✓ Supabase Auth user session established'

          EAW_STATUS="$(curl --silent --show-error \
            --output /tmp/eaw-launch-body \
            --dump-header /tmp/eaw-launch-headers \
            --write-out '%{http_code}' \
            --cookie "eaw_access_token=$ACCESS_TOKEN" \
            "$EAW_BASE/api/learning/launch?entitlement=$ENTITLEMENT_ID")"
          case "$EAW_STATUS" in
            301|302|303|307|308) ;;
            *) echo "::error::EAW launch returned HTTP $EAW_STATUS"; exit 1 ;;
          esac
          HANDOFF_URL="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/eaw-launch-headers)"
          if [[ "$HANDOFF_URL" != "$LEARNING_BASE/auth/handoff"* ]]; then
            echo '::error::EAW launch did not target the secured learning preview handoff'
            exit 1
          fi
          if [[ "$HANDOFF_URL" != *"training_id=$TRAINING_ID"* ]]; then
            echo '::error::EAW launch lost the canonical training_id'
            exit 1
          fi
          echo '✓ EAW launch validated entitlement and produced one-time learning handoff'

          HANDOFF_STATUS="$(curl --silent --show-error \
            --output /tmp/handoff-body \
            --dump-header /tmp/handoff-headers \
            --cookie-jar /tmp/learning-cookies \
            --write-out '%{http_code}' \
            "$HANDOFF_URL")"
          case "$HANDOFF_STATUS" in
            301|302|303|307|308) ;;
            *) echo "::error::Learning handoff returned HTTP $HANDOFF_STATUS"; exit 1 ;;
          esac
          COURSE_PATH="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/handoff-headers)"
          if [[ "$COURSE_PATH" != *"/leren/togaf-business-architecture-readiness"* ]]; then
            echo '::error::Learning handoff did not return the expected course route'
            exit 1
          fi
          if [[ "$COURSE_PATH" == http* ]]; then COURSE_URL="$COURSE_PATH"; else COURSE_URL="$LEARNING_BASE$COURSE_PATH"; fi
          echo '✓ One-time handoff exchanged for HttpOnly learning session'

          COURSE_STATUS="$(curl --silent --show-error --location \
            --cookie /tmp/learning-cookies --cookie-jar /tmp/learning-cookies \
            --output /tmp/course.html --write-out '%{http_code}' "$COURSE_URL")"
          if [ "$COURSE_STATUS" != '200' ]; then
            echo "::error::Course page returned HTTP $COURSE_STATUS"
            exit 1
          fi
          grep -q 'TOGAF' /tmp/course.html || { echo '::error::Course page did not render the purchased training'; exit 1; }
          grep -q 'Enterprise Architecture &amp; de TOGAF Standard\|Enterprise Architecture & de TOGAF Standard' /tmp/course.html || { echo '::error::Published module 1 not rendered'; exit 1; }
          echo '✓ Purchased course and published module list render under the shared entitlement'

          MODULE_STATUS="$(curl --silent --show-error --location \
            --cookie /tmp/learning-cookies --cookie-jar /tmp/learning-cookies \
            --output /tmp/module.html --write-out '%{http_code}' \
            "$LEARNING_BASE/leren/togaf-business-architecture-readiness/module/1")"
          if [ "$MODULE_STATUS" != '200' ]; then
            echo "::error::Published module page returned HTTP $MODULE_STATUS"
            exit 1
          fi
          grep -q 'Enterprise Architecture' /tmp/module.html || { echo '::error::Module content missing'; exit 1; }
          echo '✓ Published module content is entitlement-gated and readable'

          VIDEO_STATUS="$(curl --silent --show-error \
            --cookie /tmp/learning-cookies \
            --output /dev/null --dump-header /tmp/video-headers --write-out '%{http_code}' \
            "$LEARNING_BASE/api/video-url/1/hoofdstuk-1?training_id=$TRAINING_ID")"
          case "$VIDEO_STATUS" in
            301|302|303|307|308) ;;
            *) echo "::error::Signed video route returned HTTP $VIDEO_STATUS"; exit 1 ;;
          esac
          VIDEO_LOCATION="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/video-headers)"
          if [[ "$VIDEO_LOCATION" != https://jtdcinvkpprgnwvtwvms.supabase.co/* ]]; then
            echo '::error::Video route did not return a signed URL from the bounded media project'
            exit 1
          fi
          echo '✓ Video access is checked and resolves to a signed media URL'

          CHAT_PAYLOAD="$(node -e "process.stdout.write(JSON.stringify({trainingId:process.env.TRAINING_ID,messages:[{role:'user',content:'Leg kort uit wat Enterprise Architecture is.'}]}))")"
          CHAT_STATUS="$(curl --silent --show-error \
            --request POST "$LEARNING_BASE/api/chat/1" \
            --cookie /tmp/learning-cookies \
            --header 'Content-Type: application/json' \
            --data "$CHAT_PAYLOAD" \
            --output /tmp/chat.json --write-out '%{http_code}')"
          if [ "$CHAT_STATUS" = '503' ] && grep -q 'ai_not_configured' /tmp/chat.json; then
            echo '⚠ Alexander route is correctly secured but OPENAI_API_KEY is not configured for Preview'
          elif [ "$CHAT_STATUS" = '200' ]; then
            echo '✓ Alexander tutor responded successfully'
          else
            echo "::error::Alexander route returned unexpected HTTP $CHAT_STATUS"
            exit 1
          fi

          QUIZ_PAYLOAD="$(node -e "process.stdout.write(JSON.stringify({trainingId:process.env.TRAINING_ID,antwoorden:{'1':'A','2':'A','3':'A','4':'A','5':'A','6':'A'}}))")"
          QUIZ_STATUS="$(curl --silent --show-error \
            --request POST "$LEARNING_BASE/api/grade-quiz/1" \
            --cookie /tmp/learning-cookies \
            --header 'Content-Type: application/json' \
            --data "$QUIZ_PAYLOAD" \
            --output /tmp/quiz.json --write-out '%{http_code}')"
          if [ "$QUIZ_STATUS" != '200' ]; then
            echo "::error::Self-test/progress route returned HTTP $QUIZ_STATUS"
            exit 1
          fi
          node -e "const d=require('/tmp/quiz.json'); if(!Array.isArray(d.resultaten)||d.resultaten.length!==6||typeof d.score!=='number') process.exit(1)" || { echo '::error::Trusted self-test result contract missing'; exit 1; }
          echo '✓ Self-test is graded server-side and shared progress was written'

          COURSE_AFTER_STATUS="$(curl --silent --show-error --location \
            --cookie /tmp/learning-cookies --output /tmp/course-after.html --write-out '%{http_code}' \
            "$LEARNING_BASE/leren/togaf-business-architecture-readiness")"
          if [ "$COURSE_AFTER_STATUS" != '200' ]; then
            echo "::error::Course page after progress returned HTTP $COURSE_AFTER_STATUS"
            exit 1
          fi
          grep -Eq 'Voortgang [1-9][0-9]*%' /tmp/course-after.html || { echo '::error::Course progress summary did not update'; exit 1; }
          echo '✓ Learning progress is reflected back from shared Supabase state'

          echo 'E2E_RESULT=PASS'
