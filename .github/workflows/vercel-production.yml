name: Deploy learning production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: learning-platform-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_ZY5Sxra8t5DhA4S9zRTLmRnq
      VERCEL_PROJECT_ID: prj_ULEAHWZ1J4r1GDmzxDU1sGJ3uXaA
      VERCEL_PROJECT_NAME: learning-platform
    steps:
      - uses: actions/checkout@v4

      - name: Verify Solution Architecture release experience completeness
        run: node scripts/verify-solution-architecture-experience.mjs release

      - name: Verify Solution Architecture release presenter assets
        run: node scripts/verify-solution-architecture-presenter-assets.mjs release

      - name: Validate project-scoped Vercel token
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN missing'; exit 1; }
          STATUS="$(curl --silent --show-error --output /tmp/project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID")"
          test "$STATUS" = '200' || { echo "::error::Token cannot access learning-platform (HTTP $STATUS)"; exit 1; }

      - name: Ensure legacy video signing secret has production scope
        shell: bash
        run: |
          STATUS="$(curl --silent --show-error --output /tmp/envs-decrypted.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?decrypt=true&teamId=$VERCEL_TEAM_ID")"
          test "$STATUS" = '200' || { echo "::error::Cannot inspect Vercel environment configuration (HTTP $STATUS)"; exit 1; }

          node <<'NODE'
          const fs = require('fs');
          const envs = JSON.parse(fs.readFileSync('/tmp/envs-decrypted.json','utf8')).envs ?? [];
          const key = 'VIDEO_SUPABASE_SERVICE_ROLE_KEY';
          const matching = envs.filter((entry) => entry.key === key);
          const production = matching.filter((entry) => Array.isArray(entry.target) && entry.target.includes('production'));
          if (production.length) {
            fs.writeFileSync('/tmp/legacy-video-secret-action.json', JSON.stringify({ skip: true }), { mode: 0o600 });
            console.log('Legacy video signing secret already has production scope.');
            process.exit(0);
          }
          const preview = matching.filter((entry) => Array.isArray(entry.target) && entry.target.includes('preview'));
          const safe = preview.map((entry) => ({ id: entry.id, target: entry.target, type: entry.type, gitBranch: entry.gitBranch ?? null, decrypted: entry.decrypted ?? null }));
          if (!preview.length) {
            console.error(`::error::No existing Preview ${key} found to clone safely.`);
            process.exit(1);
          }
          const values = new Set(preview.map((entry) => typeof entry.value === 'string' ? entry.value : '').filter(Boolean));
          if (values.size !== 1) {
            console.error(`::error::Preview ${key} entries do not resolve to exactly one decrypted value; refusing production clone. Metadata: ${JSON.stringify(safe)}`);
            process.exit(1);
          }
          const value = [...values][0];
          const payload = [{
            key,
            value,
            type: 'encrypted',
            target: ['production'],
            comment: 'Production copy of existing Vercel-managed legacy chapter video signing secret',
          }];
          fs.writeFileSync('/tmp/legacy-video-secret-production.json', JSON.stringify(payload), { mode: 0o600 });
          fs.writeFileSync('/tmp/legacy-video-secret-action.json', JSON.stringify({ skip: false }), { mode: 0o600 });
          console.log(`Resolved ${preview.length} Preview ${key} configuration(s) to one consistent value; production copy prepared without logging the value.`);
          NODE

          SKIP="$(node -e "const p=require('/tmp/legacy-video-secret-action.json');process.stdout.write(String(Boolean(p.skip)))")"
          if [ "$SKIP" = 'true' ]; then rm -f /tmp/envs-decrypted.json; exit 0; fi
          STATUS="$(curl --silent --show-error --output /tmp/legacy-video-secret-production-response.json --write-out '%{http_code}' \
            --request POST \
            --url "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_TEAM_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/legacy-video-secret-production.json)"
          rm -f /tmp/envs-decrypted.json /tmp/legacy-video-secret-production.json
          case "$STATUS" in 200|201) ;; *) echo "::error::Could not create production-scoped legacy video signing secret (HTTP $STATUS)"; exit 1 ;; esac
          echo 'Production-scoped legacy video signing secret configured inside Vercel.'

      - name: Configure Solution Architecture production release flags
        shell: bash
        run: |
          cat > /tmp/release-env.json <<'JSON'
          [
            {
              "key": "EAW_SOLUTION_ARCHITECTURE_PRODUCTION_ENABLED",
              "value": "true",
              "type": "plain",
              "target": ["production"],
              "comment": "Controlled Solution Architecture production release switch"
            },
            {
              "key": "EAW_ADAPTIVE_PERSISTENCE_ENABLED",
              "value": "true",
              "type": "plain",
              "target": ["production"],
              "comment": "Persist adaptive learner state for released Solution Architecture course"
            }
          ]
          JSON
          STATUS="$(curl --silent --show-error --output /tmp/release-env-response.json --write-out '%{http_code}' \
            --request POST \
            --url "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_TEAM_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/release-env.json)"
          case "$STATUS" in 200|201) ;; *) echo "::error::Could not configure production release flags (HTTP $STATUS)"; exit 1 ;; esac

      - name: Verify required production environment keys
        shell: bash
        run: |
          STATUS="$(curl --silent --show-error --output /tmp/envs.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID")"
          test "$STATUS" = '200' || { echo "::error::Cannot inspect production env keys (HTTP $STATUS)"; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const envs = JSON.parse(fs.readFileSync('/tmp/envs.json','utf8')).envs ?? [];
          const productionKeys = new Set(
            envs
              .filter((entry) => Array.isArray(entry.target) && entry.target.includes('production'))
              .map((entry) => entry.key),
          );
          const required = [
            'EAW_SUPABASE_URL',
            'EAW_SUPABASE_PUBLISHABLE_KEY',
            'EAW_ACCOUNT_URL',
            'VIDEO_SUPABASE_URL',
            'VIDEO_SUPABASE_SERVICE_ROLE_KEY',
            'EAW_SOLUTION_ARCHITECTURE_PRODUCTION_ENABLED',
            'EAW_ADAPTIVE_PERSISTENCE_ENABLED',
          ];
          const missing = required.filter((key) => !productionKeys.has(key));
          if (missing.length) {
            console.error(`::error::Missing production configuration: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log('Production environment key contract: PASS');
          NODE

      - name: Prepare production deployment payload
        shell: bash
        run: |
          python3 <<'PY'
          import base64, json, os
          from pathlib import Path
          excluded = {'.git', '.next', 'node_modules', '.vercel'}
          files = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              if path.as_posix().startswith('.github/'):
                  continue
              files.append({
                  'file': path.as_posix(),
                  'data': base64.b64encode(path.read_bytes()).decode(),
                  'encoding': 'base64',
              })
          payload = {
              'name': os.environ['VERCEL_PROJECT_NAME'],
              'project': os.environ['VERCEL_PROJECT_ID'],
              'target': 'production',
              'files': files,
              'gitMetadata': {
                  'remoteUrl': 'https://github.com/ReinierNoob/learning-platform',
                  'commitRef': os.environ.get('GITHUB_REF_NAME', 'main'),
                  'commitSha': os.environ.get('GITHUB_SHA', ''),
                  'commitMessage': 'EAW learning-platform gated production deploy',
                  'ci': True,
                  'ciType': 'github-actions',
                  'ciGitRepoVisibility': 'public',
              },
              'projectSettings': {'framework':'nextjs','nodeVersion':'24.x'},
          }
          Path('/tmp/deployment.json').write_text(json.dumps(payload))
          PY

      - name: Deploy gated production candidate
        id: deploy
        shell: bash
        run: |
          STATUS="$(curl --silent --show-error --output /tmp/deploy.json --write-out '%{http_code}' \
            --request POST \
            --url "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/deployment.json)"
          case "$STATUS" in 200|201) ;; *) echo "::error::Production deployment failed (HTTP $STATUS)"; exit 1 ;; esac
          URL="$(node -e "const d=require('/tmp/deploy.json');process.stdout.write(d.url||'')")"
          ID="$(node -e "const d=require('/tmp/deploy.json');process.stdout.write(d.id||d.uid||'')")"
          test -n "$URL" -a -n "$ID" || { echo '::error::Deployment URL/ID missing'; exit 1; }
          echo "url=https://$URL" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Confirm gated production candidate READY
        shell: bash
        run: |
          ID='${{ steps.deploy.outputs.deployment_id }}'
          for attempt in $(seq 1 40); do
            STATUS="$(curl --silent --show-error --output /tmp/status.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$ID?teamId=$VERCEL_TEAM_ID")"
            test "$STATUS" = '200' || exit 1
            STATE="$(node -e "const d=require('/tmp/status.json');process.stdout.write(d.readyState||'')")"
            if [ "$STATE" = 'READY' ]; then echo 'Gated learning production candidate READY.'; exit 0; fi
            if [ "$STATE" = 'ERROR' ] || [ "$STATE" = 'CANCELED' ] || [ "$STATE" = 'BLOCKED' ]; then exit 1; fi
            sleep 10
          done
          echo '::error::Production deployment did not become READY'; exit 1

      - name: Promote gated deployment to production domains
        shell: bash
        run: |
          ID='${{ steps.deploy.outputs.deployment_id }}'
          STATUS="$(curl --silent --show-error --output /tmp/promote.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$ID?teamId=$VERCEL_TEAM_ID")"
          case "$STATUS" in 200|201|202) ;; *) echo "::error::Could not promote gated deployment (HTTP $STATUS)"; exit 1 ;; esac

          for attempt in 1 2 3; do
            STATUS="$(curl --silent --show-error --output /tmp/aliases.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v2/deployments/$ID/aliases?teamId=$VERCEL_TEAM_ID")"
            test "$STATUS" = '200' || exit 1
            if node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/aliases.json','utf8'));
          const aliases = body.aliases ?? body;
          const names = Array.isArray(aliases)
            ? aliases.map((item) => typeof item === 'string' ? item : item.alias ?? item.domain ?? item.url ?? '')
            : [];
          if (!names.includes('leren.enterprisearchitectureworks.nl')) process.exit(1);
          console.log('Production alias is pinned to the gated deployment.');
          NODE
            then
              if [ "$attempt" = '3' ]; then exit 0; fi
              sleep 5
            else
              sleep 5
            fi
          done
          echo '::error::Production alias did not remain pinned to the gated deployment'; exit 1
