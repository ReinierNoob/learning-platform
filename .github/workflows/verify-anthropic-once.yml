name: Verify Anthropic preview key once

on:
  push:
    branches:
      - agent/eaw-shared-auth-entitlements
    paths:
      - '.github/workflows/verify-anthropic-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_ZY5Sxra8t5DhA4S9zRTLmRnq
      VERCEL_PROJECT_ID: prj_ULEAHWZ1J4r1GDmzxDU1sGJ3uXaA
    steps:
      - name: Inspect Anthropic environment variable names and scopes only
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN missing'; exit 1; }
          STATUS="$(curl --silent --show-error --output /tmp/envs.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID")"
          test "$STATUS" = '200' || { echo "::error::Cannot inspect env metadata (HTTP $STATUS)"; exit 1; }
          node <<'NODE'
          const fs=require('fs');
          const envs=JSON.parse(fs.readFileSync('/tmp/envs.json','utf8')).envs ?? [];
          const matches=envs.filter(e => String(e.key||'').toLowerCase().includes('anthropic'));
          if (!matches.length) {
            console.log('Anthropic env keys: none');
            process.exit(0);
          }
          for (const e of matches) {
            console.log(`Anthropic env key: ${e.key}; targets=${JSON.stringify(e.target||[])}; gitBranch=${e.gitBranch||'-'}`);
          }
          NODE
