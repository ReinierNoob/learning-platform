name: Solution Architecture physical UX E2E

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/solution-architecture-physical-ux-e2e.yml'
      - 'package.json'
      - 'e2e/solution-architecture-physical-ux.spec.ts'
      - 'app/leren/**'
      - 'app/api/presenter-media/**'
      - 'components/adaptive/**'
      - 'content/solution-architecture-presenter-**'
      - 'lib/solution-architecture-presenter-**'
      - 'lib/solution-architecture-module-**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: solution-architecture-physical-ux-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  physical-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UX_BOOTSTRAP_URL: https://mhjykzrljvtxauaatlom.supabase.co/functions/v1/github-ux-e2e-bootstrap
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_ZY5Sxra8t5DhA4S9zRTLmRnq
      VERCEL_PROJECT_ID: prj_ULEAHWZ1J4r1GDmzxDU1sGJ3uXaA
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Resolve exact READY Vercel preview and create short-lived share access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN missing'; exit 1; }
          DEPLOYMENT_ID=''
          DEPLOYMENT_URL=''
          for attempt in $(seq 1 30); do
            STATUS="$(curl --silent --show-error --output /tmp/deployments.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&limit=20")"
            test "$STATUS" = '200' || { echo "::error::Cannot inspect Vercel previews (HTTP $STATUS)"; exit 1; }
            readarray -t MATCH < <(node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const sha = process.env.PR_HEAD_SHA;
          const deployments = Array.isArray(data.deployments) ? data.deployments : [];
          const exact = deployments.find((item) => item?.meta?.githubCommitSha === sha);
          if (!exact) process.exit(0);
          const state = exact.readyState ?? exact.state ?? '';
          if (['ERROR','CANCELED','BLOCKED'].includes(state)) {
            console.error(`::error::Exact Vercel preview is ${state}`);
            process.exit(2);
          }
          if (state === 'READY') {
            console.log(exact.uid ?? exact.id ?? '');
            console.log(exact.url ?? '');
          }
          NODE
            ) || exit $?
            DEPLOYMENT_ID="${MATCH[0]:-}"
            DEPLOYMENT_URL="${MATCH[1]:-}"
            if [ -n "$DEPLOYMENT_ID" ] && [ -n "$DEPLOYMENT_URL" ]; then break; fi
            sleep 5
          done
          test -n "$DEPLOYMENT_ID" -a -n "$DEPLOYMENT_URL" || { echo '::error::Exact PR-head Vercel preview did not become READY'; exit 1; }

          STATUS="$(curl --silent --show-error --output /tmp/share.json --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"ttl":1200}' \
            "https://api.vercel.com/aliases/$DEPLOYMENT_ID/protection-bypass?teamId=$VERCEL_TEAM_ID")"
          test "$STATUS" = '200' || { cat /tmp/share.json; echo "::error::Cannot create deployment-scoped Vercel share access (HTTP $STATUS)"; exit 1; }
          SHARE="$(node -e "const d=require('/tmp/share.json');process.stdout.write(d.value||d.protectionBypass?.value||d.secret||'')")"
          test -n "$SHARE" || { echo '::error::Vercel share secret missing'; exit 1; }
          echo "::add-mask::$SHARE"
          {
            echo "EAW_UX_BASE_URL=https://$DEPLOYMENT_URL"
            echo "EAW_UX_VERCEL_SHARE=$SHARE"
            echo "EAW_UX_VERCEL_PROTECTION_ID=$DEPLOYMENT_ID"
          } >> "$GITHUB_ENV"
          echo "Physical UX target: $DEPLOYMENT_ID / $DEPLOYMENT_URL / $PR_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Bootstrap temporary EAW learner through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=eaw-learning-platform-ux-e2e")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
          test -n "$OIDC_TOKEN" || { echo '::error::GitHub OIDC token missing'; exit 1; }
          echo "::add-mask::$OIDC_TOKEN"
          BOOTSTRAP="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"action":"create"}' \
            "$UX_BOOTSTRAP_URL")"
          printf '%s' "$BOOTSTRAP" > /tmp/ux-bootstrap.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/ux-bootstrap.json','utf8'));
          if (!data.ok || !data.token_hash || !data.user_id || !data.order_id || !data.order_item_id || !data.entitlement_id) {
            console.error('::error::Incomplete UX bootstrap response');
            process.exit(1);
          }
          for (const [key,value] of Object.entries({
            EAW_UX_TOKEN_HASH: data.token_hash,
            EAW_UX_TRAINING_ID: data.training_id,
            EAW_UX_USER_ID: data.user_id,
            EAW_UX_ORDER_ID: data.order_id,
            EAW_UX_ORDER_ITEM_ID: data.order_item_id,
            EAW_UX_ENTITLEMENT_ID: data.entitlement_id,
          })) fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          console.log(`::add-mask::${data.token_hash}`);
          NODE

      - name: Run physical browser gate on exact Vercel preview
        run: npx playwright test e2e/solution-architecture-physical-ux.spec.ts --workers=1 --reporter=line

      - name: Upload physical UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solution-architecture-physical-ux-evidence
          path: |
            artifacts/solution-architecture-ux/**
            playwright-report/**
            test-results/**
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup temporary EAW learner through GitHub OIDC
        if: always() && env.EAW_UX_USER_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=eaw-learning-platform-ux-e2e")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"
          CLEANUP="$(node -e "process.stdout.write(JSON.stringify({action:'cleanup',user_id:process.env.EAW_UX_USER_ID,order_id:process.env.EAW_UX_ORDER_ID,order_item_id:process.env.EAW_UX_ORDER_ITEM_ID,entitlement_id:process.env.EAW_UX_ENTITLEMENT_ID}))")"
          RESPONSE="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$CLEANUP" \
            "$UX_BOOTSTRAP_URL")"
          printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(!v.ok)process.exit(1);console.log('OIDC UX cleanup: PASS')})"

      - name: Revoke temporary Vercel share access
        if: always() && env.EAW_UX_VERCEL_SHARE != '' && env.EAW_UX_VERCEL_PROTECTION_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(node -e "process.stdout.write(JSON.stringify({revoke:{secret:process.env.EAW_UX_VERCEL_SHARE,regenerate:false}}))")"
          STATUS="$(curl --silent --show-error --output /tmp/share-revoke.json --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$BODY" \
            "https://api.vercel.com/aliases/$EAW_UX_VERCEL_PROTECTION_ID/protection-bypass?teamId=$VERCEL_TEAM_ID")"
          test "$STATUS" = '200' || { cat /tmp/share-revoke.json; echo "::error::Vercel share revoke failed (HTTP $STATUS)"; exit 1; }
          echo 'Vercel deployment share cleanup: PASS'
