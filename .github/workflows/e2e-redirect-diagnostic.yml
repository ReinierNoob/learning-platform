name: EAW handoff diagnostic

on:
  push:
    branches:
      - agent/eaw-shared-auth-entitlements
    paths:
      - '.github/workflows/e2e-redirect-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DIAGNOSTIC_URL: https://mhjykzrljvtxauaatlom.supabase.co/functions/v1/e2e-handoff-diagnostic
    steps:
      - name: Call handoff with the existing preview user
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error \
            --request POST "$DIAGNOSTIC_URL" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --output /tmp/result.json \
            --write-out '%{http_code}')"
          cat /tmp/result.json
          if [ "$STATUS" != '200' ]; then
            echo "::error::Handoff diagnostic returned HTTP $STATUS"
            exit 1
          fi
