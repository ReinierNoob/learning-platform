name: EAW protected preview E2E runner

on:
  push:
    branches:
      - agent/eaw-shared-auth-entitlements
    paths:
      - '.github/workflows/e2e-redirect-diagnostic.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RUNNER_URL: https://mhjykzrljvtxauaatlom.supabase.co/functions/v1/e2e-learning-runner
    steps:
      - name: Execute protected preview integration chain
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error \
            --request POST "$RUNNER_URL" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --output /tmp/e2e.json \
            --write-out '%{http_code}')"
          cat /tmp/e2e.json
          if [ "$STATUS" != '200' ]; then
            echo "::error::Protected E2E runner returned HTTP $STATUS"
            exit 1
          fi
          node -e "const d=require('/tmp/e2e.json'); if(d.ok!==true) process.exit(1); console.log('E2E_RESULT=PASS'); console.log('CHECKS='+d.checks.join(',')); console.log('PROGRESS_PERCENTAGE='+d.progress_percentage); console.log('AI_STATUS='+d.ai_status);"
