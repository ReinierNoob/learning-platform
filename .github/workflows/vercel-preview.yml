name: Deploy learning preview

on:
  push:
    branches: [agent/eaw-shared-auth-entitlements]
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: 'Type DEPLOY_PREVIEW to create a non-production Vercel preview'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: learning-platform-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ github.event_name == 'push' || inputs.confirm_preview == 'DEPLOY_PREVIEW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_ZY5Sxra8t5DhA4S9zRTLmRnq
      VERCEL_PROJECT_ID: prj_ULEAHWZ1J4r1GDmzxDU1sGJ3uXaA
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require Vercel deployment token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::GitHub secret VERCEL_TOKEN is missing. No deployment was attempted.'
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull existing preview configuration
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify required runtime secrets exist
        shell: bash
        run: |
          ENV_FILE='.vercel/.env.preview.local'
          if [ ! -f "$ENV_FILE" ]; then
            echo '::error::Vercel preview environment file was not created.'
            exit 1
          fi

          if ! grep -q '^OPENAI_API_KEY=' "$ENV_FILE"; then
            echo '::error::OPENAI_API_KEY is missing from Vercel preview environment.'
            exit 1
          fi

          if ! grep -qE '^(VIDEO_SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SERVICE_ROLE_KEY)=' "$ENV_FILE"; then
            echo '::error::Existing media Supabase service key is missing from Vercel preview environment.'
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build preview
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview only
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Learning preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm deployment is not production
        shell: bash
        run: |
          case '${{ steps.deploy.outputs.url }}' in
            *vercel.app*) ;;
            *) echo '::error::Unexpected deployment URL'; exit 1 ;;
          esac
          echo 'Preview deployment created. Production promotion is intentionally not part of this workflow.'
