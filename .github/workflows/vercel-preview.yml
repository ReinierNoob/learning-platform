name: Deploy learning preview

on:
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: 'Type DEPLOY_PREVIEW to create a non-production Vercel preview'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: learning-platform-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ inputs.confirm_preview == 'DEPLOY_PREVIEW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_ZY5Sxra8t5DhA4S9zRTLmRnq
      VERCEL_PROJECT_ID: prj_ULEAHWZ1J4r1GDmzxDU1sGJ3uXaA
      VERCEL_PROJECT_NAME: learning-platform
      EAW_PREVIEW_URL: https://enterprise-architecture-works-git-2668d7-reiniernoobs-projects.vercel.app
      EAW_SUPABASE_URL: https://mhjykzrljvtxauaatlom.supabase.co
      EAW_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qa9v9qDYMzr3Fr3h0N29gg_1Ip6gfb5
      VIDEO_SUPABASE_URL: https://jtdcinvkpprgnwvtwvms.supabase.co
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate project-scoped Vercel token
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN missing'; exit 1; }
          STATUS="$(curl --silent --show-error --output /tmp/project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID")"
          test "$STATUS" = '200' || { echo "::error::Token cannot access learning-platform (HTTP $STATUS)"; exit 1; }

      - name: Configure non-secret preview variables
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const branch = process.env.GITHUB_REF_NAME;
          if (!branch) throw new Error('GITHUB_REF_NAME missing');
          const adaptiveKeys = [
            'EAW_ADAPTIVE_MODULE1_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE2_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE3_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE4_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE5_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE6_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE7_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE8_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE9_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE10_IN_LEARNING',
          ];
          fs.writeFileSync('/tmp/env.json', JSON.stringify([
            { key: 'EAW_SUPABASE_URL', value: process.env.EAW_SUPABASE_URL, type: 'plain', target: ['preview'] },
            { key: 'EAW_SUPABASE_PUBLISHABLE_KEY', value: process.env.EAW_SUPABASE_PUBLISHABLE_KEY, type: 'plain', target: ['preview'] },
            { key: 'EAW_ACCOUNT_URL', value: `${process.env.EAW_PREVIEW_URL}/account`, type: 'plain', target: ['preview'] },
            { key: 'VIDEO_SUPABASE_URL', value: process.env.VIDEO_SUPABASE_URL, type: 'plain', target: ['preview'] },
            { key: 'ANTHROPIC_MODEL', value: 'claude-sonnet-5', type: 'plain', target: ['preview'] },
            { key: 'OPENAI_MODEL', value: 'gpt-5-mini', type: 'plain', target: ['preview'] },
            ...adaptiveKeys.map((key) => ({ key, value: 'true', type: 'plain', target: ['preview'], gitBranch: branch })),
          ]));
          NODE
          STATUS="$(curl --silent --show-error --output /tmp/env-response.json --write-out '%{http_code}' \
            --request POST \
            --url "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_TEAM_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/env.json)"
          case "$STATUS" in 200|201) ;; *) echo "::error::Preview env update failed (HTTP $STATUS)"; exit 1 ;; esac

      - name: Verify required preview secret configuration
        shell: bash
        run: |
          STATUS="$(curl --silent --show-error --output /tmp/envs.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID")"
          test "$STATUS" = '200' || { echo "::error::Cannot inspect Preview env keys (HTTP $STATUS)"; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const envs = JSON.parse(fs.readFileSync('/tmp/envs.json','utf8')).envs ?? [];
          const previewEntries = envs.filter(e => Array.isArray(e.target) && e.target.includes('preview'));
          const keys = new Set(previewEntries.map(e => e.key));
          const required = ['EAW_SUPABASE_URL','EAW_SUPABASE_PUBLISHABLE_KEY','EAW_ACCOUNT_URL','VIDEO_SUPABASE_URL','VIDEO_SUPABASE_SERVICE_ROLE_KEY'];
          const missing = required.filter(k => !keys.has(k));
          if (missing.length) { console.error(`::error::Missing Preview configuration: ${missing.join(', ')}`); process.exit(1); }
          const adaptiveKeys = [
            'EAW_ADAPTIVE_MODULE1_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE2_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE3_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE4_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE5_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE6_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE7_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE8_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE9_IN_LEARNING',
            'EAW_ADAPTIVE_MODULE10_IN_LEARNING',
          ];
          const branch = process.env.GITHUB_REF_NAME;
          const branchAdaptive = new Set(previewEntries.filter(e => e.gitBranch === branch).map(e => e.key));
          const missingAdaptive = adaptiveKeys.filter(key => !branchAdaptive.has(key));
          if (missingAdaptive.length) { console.error(`::error::Missing branch-scoped adaptive Preview configuration: ${missingAdaptive.join(', ')}`); process.exit(1); }
          if (!keys.has('ANTHROPIC_API_KEY') && !keys.has('anthropic_API_KEY') && !keys.has('OPENAI_API_KEY')) {
            console.log('::warning::No Alexander AI key configured; tutor will return ai_not_configured.');
          }
          NODE

      - name: Build
        env:
          EAW_SUPABASE_URL: ${{ env.EAW_SUPABASE_URL }}
          EAW_SUPABASE_PUBLISHABLE_KEY: ${{ env.EAW_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Prepare deployment payload
        shell: bash
        run: |
          python3 <<'PY'
          import base64, json, os
          from pathlib import Path
          excluded = {'.git','.next','node_modules','.vercel'}
          files=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or any(part in excluded for part in p.parts) or p.as_posix().startswith('.github/'):
              continue
            files.append({'file':p.as_posix(),'data':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'})
          payload={
            'name':os.environ['VERCEL_PROJECT_NAME'],
            'project':os.environ['VERCEL_PROJECT_ID'],
            'files':files,
            'gitMetadata':{
              'remoteUrl':'https://github.com/ReinierNoob/learning-platform',
              'commitRef':os.environ.get('GITHUB_REF_NAME','agent/eaw-shared-auth-entitlements'),
              'commitSha':os.environ.get('GITHUB_SHA',''),
              'commitMessage':'EAW learning-platform preview',
              'ci':True,'ciType':'github-actions','ciGitRepoVisibility':'public'
            },
            'projectSettings':{'framework':'nextjs','nodeVersion':'24.x'}
          }
          Path('/tmp/deployment.json').write_text(json.dumps(payload))
          PY

      - name: Deploy preview only
        id: deploy
        shell: bash
        run: |
          STATUS="$(curl --silent --show-error --output /tmp/deploy.json --write-out '%{http_code}' \
            --request POST \
            --url "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/deployment.json)"
          case "$STATUS" in 200|201) ;; *) echo "::error::Preview deployment failed (HTTP $STATUS)"; exit 1 ;; esac
          URL="$(node -e "const d=require('/tmp/deploy.json');process.stdout.write(d.url||'')")"
          ID="$(node -e "const d=require('/tmp/deploy.json');process.stdout.write(d.id||d.uid||'')")"
          test -n "$URL" -a -n "$ID" || { echo '::error::Deployment URL/ID missing'; exit 1; }
          echo "url=https://$URL" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$ID" >> "$GITHUB_OUTPUT"
          echo "### Learning preview" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm READY without production promotion
        shell: bash
        run: |
          URL='${{ steps.deploy.outputs.url }}'
          ID='${{ steps.deploy.outputs.deployment_id }}'
          case "$URL" in https://*.vercel.app) ;; *) echo '::error::Unexpected deployment URL'; exit 1 ;; esac
          for attempt in $(seq 1 30); do
            STATUS="$(curl --silent --show-error --output /tmp/status.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$ID?teamId=$VERCEL_TEAM_ID")"
            test "$STATUS" = '200' || exit 1
            STATE="$(node -e "const d=require('/tmp/status.json');process.stdout.write(d.readyState||'')")"
            if [ "$STATE" = 'READY' ]; then echo 'Preview READY; production untouched.'; exit 0; fi
            if [ "$STATE" = 'ERROR' ] || [ "$STATE" = 'CANCELED' ] || [ "$STATE" = 'BLOCKED' ]; then exit 1; fi
            sleep 5
          done
          echo '::error::Preview did not become READY'; exit 1
