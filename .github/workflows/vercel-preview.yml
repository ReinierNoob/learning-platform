name: Deploy learning preview

on:
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: 'Type DEPLOY_PREVIEW to create a non-production Vercel preview'
        required: true
        type: string
  push:
    branches:
      - agent/eaw-shared-auth-entitlements
    paths:
      - '.github/workflows/vercel-preview.yml'

permissions:
  contents: read

concurrency:
  group: learning-platform-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ github.event_name == 'push' || inputs.confirm_preview == 'DEPLOY_PREVIEW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_ZY5Sxra8t5DhA4S9zRTLmRnq
      VERCEL_PROJECT_ID: prj_ULEAHWZ1J4r1GDmzxDU1sGJ3uXaA
      VERCEL_PROJECT_NAME: learning-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate project-scoped Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::GitHub secret VERCEL_TOKEN is missing. No deployment was attempted.'
            exit 1
          fi
          STATUS="$(curl --silent --show-error --output /tmp/vercel-project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID")"
          if [ "$STATUS" != '200' ]; then
            echo "::error::VERCEL_TOKEN cannot access the learning-platform project (project endpoint HTTP $STATUS). No deployment was attempted."
            exit 1
          fi

      - name: Verify required preview environment keys exist
        shell: bash
        run: |
          STATUS="$(curl --silent --show-error --output /tmp/vercel-env.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID")"
          if [ "$STATUS" != '200' ]; then
            echo "::error::Unable to inspect Vercel preview environment keys (HTTP $STATUS)."
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/vercel-env.json', 'utf8'));
          const envs = Array.isArray(data.envs) ? data.envs : [];
          const appliesToPreview = (env) => Array.isArray(env.target) && env.target.includes('preview');
          const keys = new Set(envs.filter(appliesToPreview).map((env) => env.key));
          const missing = [];
          if (!keys.has('OPENAI_API_KEY')) missing.push('OPENAI_API_KEY');
          if (!keys.has('VIDEO_SUPABASE_SERVICE_ROLE_KEY') && !keys.has('SUPABASE_SERVICE_ROLE_KEY')) {
            missing.push('VIDEO_SUPABASE_SERVICE_ROLE_KEY or SUPABASE_SERVICE_ROLE_KEY');
          }
          if (missing.length) {
            console.error(`::error::Missing Vercel preview environment configuration: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log('Required Vercel preview environment keys are present.');
          NODE

      - name: Verify application build independently
        env:
          EAW_SUPABASE_URL: https://mhjykzrljvtxauaatlom.supabase.co
          EAW_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qa9v9qDYMzr3Fr3h0N29gg_1Ip6gfb5
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Create Vercel preview deployment payload
        shell: bash
        run: |
          python3 <<'PY'
          import base64, json, os
          from pathlib import Path

          root = Path('.')
          excluded_dirs = {'.git', '.next', 'node_modules', '.vercel'}
          files = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if any(part in excluded_dirs for part in path.parts):
                  continue
              if rel.startswith('.github/'):
                  continue
              data = base64.b64encode(path.read_bytes()).decode('ascii')
              files.append({'file': rel, 'data': data, 'encoding': 'base64'})

          payload = {
              'name': os.environ['VERCEL_PROJECT_NAME'],
              'project': os.environ['VERCEL_PROJECT_ID'],
              'files': files,
              'gitMetadata': {
                  'remoteUrl': 'https://github.com/ReinierNoob/learning-platform',
                  'commitRef': os.environ.get('GITHUB_REF_NAME', 'agent/eaw-shared-auth-entitlements'),
                  'commitSha': os.environ.get('GITHUB_SHA', ''),
                  'commitMessage': 'EAW learning-platform preview',
                  'ci': 'true',
                  'ciType': 'github-actions',
                  'ciGitRepoVisibility': 'public'
              },
              'projectSettings': {
                  'framework': 'nextjs',
                  'nodeVersion': '24.x'
              }
          }
          Path('/tmp/vercel-deployment.json').write_text(json.dumps(payload), encoding='utf-8')
          print(f'Prepared {len(files)} source files for preview deployment.')
          PY

      - name: Deploy preview through Vercel REST API
        id: deploy
        shell: bash
        run: |
          STATUS="$(curl --silent --show-error --output /tmp/vercel-deploy-response.json --write-out '%{http_code}' \
            --request POST \
            --url "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/vercel-deployment.json)"
          if [ "$STATUS" != '200' ] && [ "$STATUS" != '201' ]; then
            echo "::error::Vercel preview deployment request failed (HTTP $STATUS)."
            node -e "const d=require('/tmp/vercel-deploy-response.json'); console.error(d?.error?.code || 'unknown_error', d?.error?.message || '')"
            exit 1
          fi
          URL="$(node -e "const d=require('/tmp/vercel-deploy-response.json'); process.stdout.write(d.url || '')")"
          ID="$(node -e "const d=require('/tmp/vercel-deploy-response.json'); process.stdout.write(d.id || d.uid || '')")"
          if [ -z "$URL" ] || [ -z "$ID" ]; then
            echo '::error::Vercel did not return a preview deployment URL/ID.'
            exit 1
          fi
          echo "url=https://$URL" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$ID" >> "$GITHUB_OUTPUT"
          echo '### Learning preview' >> "$GITHUB_STEP_SUMMARY"
          echo "https://$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment ID: $ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm deployment is preview and wait for readiness
        shell: bash
        run: |
          URL='${{ steps.deploy.outputs.url }}'
          ID='${{ steps.deploy.outputs.deployment_id }}'
          case "$URL" in
            https://*.vercel.app) ;;
            *) echo '::error::Unexpected deployment URL'; exit 1 ;;
          esac
          for attempt in $(seq 1 30); do
            STATUS="$(curl --silent --show-error --output /tmp/vercel-ready.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$ID?teamId=$VERCEL_TEAM_ID")"
            if [ "$STATUS" != '200' ]; then
              echo "::error::Unable to read deployment status (HTTP $STATUS)."
              exit 1
            fi
            STATE="$(node -e "const d=require('/tmp/vercel-ready.json'); process.stdout.write(d.readyState || '')")"
            echo "Deployment state: $STATE"
            if [ "$STATE" = 'READY' ]; then
              echo 'Preview deployment is READY. Production promotion is intentionally not part of this workflow.'
              exit 0
            fi
            if [ "$STATE" = 'ERROR' ] || [ "$STATE" = 'CANCELED' ] || [ "$STATE" = 'BLOCKED' ]; then
              echo "::error::Preview deployment ended in state $STATE."
              exit 1
            fi
            sleep 5
          done
          echo '::error::Preview deployment did not become READY within the workflow wait window.'
          exit 1
