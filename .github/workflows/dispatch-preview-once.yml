name: Dispatch learning preview once

on:
  push:
    branches:
      - agent/eaw-shared-auth-entitlements
    paths:
      - '.github/workflows/dispatch-preview-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch final clean preview-only deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --request POST \
            --url 'https://api.github.com/repos/ReinierNoob/learning-platform/actions/workflows/vercel-preview.yml/dispatches' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"ref":"agent/eaw-shared-auth-entitlements","inputs":{"confirm_preview":"DEPLOY_PREVIEW"}}'
